# 검증과 배포.
#
# PR에서는 검증만, main 푸시에서는 검증 후 GitHub Pages로 배포한다.
# PR에서도 돌려야 개발 방침의 "main은 항상 배포 가능 상태"가 사후 확인이
# 아니라 사전 조건이 된다.
#
# 스모크 테스트(npm run smoke)는 설치된 Chrome이 필요해 여기서 돌리지 않는다.
# 릴리즈 전 로컬에서 실행하는 게이트다. README 참조.
name: 검증 · 배포

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 배포가 진행 중일 때 취소하면 Pages가 어중간한 상태로 굳는다.
# 공식 Pages 템플릿과 같이 취소하지 않고 줄을 세운다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # configure-pages가 Pages 설정을 읽고 켜는 데 필요
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: 테스트 (style.css 구조 검사 + 단위 테스트)
        run: npm test
      - name: 타입 체크 + 빌드
        run: npm run build

      # Pages 소스가 Actions로 설정되어 있지 않으면 배포가 통째로 실패한다.
      # 저장소 설정에 의존하지 않도록 워크플로에서 직접 맞춘다.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
