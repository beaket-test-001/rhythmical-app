# main 푸시 시 GitHub Pages로 자동 배포.
# 테스트와 타입 체크를 통과해야 배포한다 — 개발 방침의 "main은 항상 배포 가능 상태".
#
# 스모크 테스트(npm run smoke)는 설치된 Chrome이 필요해 여기서 돌리지 않는다.
# 릴리즈 전 로컬에서 실행하는 게이트다. README 참조.
name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 연속 푸시 시 이전 실행은 취소한다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: 테스트 (style.css 구조 검사 + 단위 테스트)
        run: npm test
      - name: 타입 체크 + 빌드
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
